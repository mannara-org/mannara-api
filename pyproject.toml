[project]
name = "mannara-api"
version = "0.1.0"
description = "API endpoints for data and workloads shared accross mannara projects "
readme = "README.md"
authors = [
    { name = "Azsu-rae", email = "aitameurmedilyas@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faker>=40.39.0",
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.48",
]

[project.scripts]
mannara-api = "mannara_api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
